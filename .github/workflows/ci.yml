name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens-and-web:
    name: Tokens, license guard, web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated tokens and example brands are up to date (and pass contrast)
        run: pnpm tokens:check
      - name: No Apple assets or Apple.com colours
        run: pnpm guard
      - name: Component catalog is complete, shelves are respected, CATALOG.md is current
        run: pnpm catalog:check
      - name: Cheat sheet runs (pnpm aurum)
        run: pnpm -s aurum list > /dev/null && pnpm -s aurum show Button > /dev/null && pnpm -s aurum tokens > /dev/null
      - name: Ejected React components still type-check
        run: |
          pnpm -s aurum eject Menu --to apps/docs/src/_ejected --platform react
          pnpm -s aurum eject Card --to apps/docs/src/_ejected --platform react
          pnpm --filter @aurum/docs exec tsc --noEmit -p .
          rm -rf apps/docs/src/_ejected
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Built React package (packages/react/dist) is committed and current
        run: |
          git diff --exit-code -- packages/react/dist
          test -z "$(git status --porcelain -- packages/react/dist)" || (echo "Run pnpm build and commit packages/react/dist" && git status --porcelain -- packages/react/dist && exit 1)
      - name: A fresh Vite app (strict tsconfig) installs and builds @aurum/react
        run: pnpm consumer:check

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: aurum_ui
        working-directory: packages/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: example app
        working-directory: packages/flutter/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
